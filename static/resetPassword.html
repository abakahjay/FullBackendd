<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    <title>Afrodatagh - Reset Password</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .reset-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        h2 {
            margin-bottom: 10px;
            color: #222;
        }

        p {
            margin-bottom: 20px;
            color: #555;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #00bfff;
            box-shadow: 0 0 4px rgba(0, 191, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #00bfff;
            color: white;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover:enabled {
            background-color: #009acd;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .message.error {
            color: red;
        }

        .message.success {
            color: green;
        }

        /* Spinner Overlay */
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #00bfff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
        }

        .btn-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 0.6s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
        }

        /* Success Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            /* display: flex; */
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 350px;
            width: 90%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modal h3 {
            margin: 0 0 10px;
            color: green;
        }

        .modal p {
            color: #444;
            margin-bottom: 15px;
        }

        .modal button {
            background-color: #00bfff;
            padding: 10px 15px;
            font-size: 15px;
            border-radius: 8px;
            border: none;
            color: white;
            cursor: pointer;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- Spinner Overlay -->
    <div class="spinner-overlay" id="spinnerOverlay">
        <div class="spinner"></div>
    </div>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal">
            <h3>✅ Password Changed!</h3>
            <p>Your password has been successfully reset.<br>Click below to close this page and log in again.</p>
            <button onclick="closePage()">Close Page</button>
        </div>
    </div>

    <div class="reset-container">
        <h2>Reset Your Password</h2>
        <p>Enter your new password and confirm it below.</p>

        <form id="resetForm">
            <input type="password" id="password" placeholder="New Password" required />
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
            <button type="submit" id="resetBtn">Reset Password</button>
        </form>

        <p id="message" class="message"></p>
    </div>

    <script>
        const form = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const spinnerOverlay = document.getElementById("spinnerOverlay");
        const resetBtn = document.getElementById("resetBtn");
        const successModal = document.getElementById("successModal");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get("token");
            const email = urlParams.get("email");

            if (!token) {
                message.className = "message error";
                message.textContent = "Invalid or missing token.";
                return;
            }

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                message.className = "message error";
                message.textContent = "Passwords do not match.";
                return;
            }

            spinnerOverlay.style.display = "flex";
            resetBtn.disabled = true;
            resetBtn.innerHTML = `Resetting <span class="btn-spinner"></span>`;

            try {
                // ?app= picks which user collection the link belongs to.
                const app = urlParams.get("app");
                const base = app === "seedbridge" ? "/api/v1/seedbridge/auth"
                    : app === "cleanbridge" ? "/api/v1/cleanbridge/auth"
                    : "/api/v1/auth";
                const response = await fetch(`${base}/reset-password/${encodeURIComponent(token)}?email=${encodeURIComponent(email)}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ newPassword: password })
                });

                const data = await response.json();

                if (response.ok) {
                    successModal.style.display = "flex"; // Show modal
                } else {
                    message.className = "message error";
                    message.textContent = data.msg || "Something went wrong.";
                }
            } catch (error) {
                console.error(error);
                message.className = "message error";
                message.textContent = "Network error. Please try again.";
            } finally {
                spinnerOverlay.style.display = "none";
                resetBtn.disabled = false;
                resetBtn.innerHTML = "Reset Password";
            }
        });

        function closePage() {
            window.close();
            // Fallback if browser blocks window.close()
            setTimeout(() => {
                alert("You can now close this page manually.");
            }, 500);
        }
    </script>
</body>

</html>
