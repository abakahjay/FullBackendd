<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Forgot your password?</title>
    <link rel="stylesheet" href="/forgotPassword.css">
</head>
<body>
    <main class="card">
        <h1>Forgot your password?</h1>
        <p class="lead">Enter the email you signed up with. We'll send you a link to choose a new password; it works for 30 minutes.</p>
        <form id="forgotForm" novalidate>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            <button type="submit" id="sendBtn">Send reset link</button>
        </form>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <a id="backLink" class="back" href="/" hidden>Back to sign in</a>
    </main>
    <script src="/forgotPassword.js"></script>
</body>
</html>
