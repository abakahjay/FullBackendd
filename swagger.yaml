openapi: 3.0.0
info:
  title: Jobs API
  contact: {}
  version: '1.0'
servers:
  - url: https://jobs-api-06.herokuapp.com/api/v1
    variables: {}
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register User
      operationId: RegisterUser
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
            example:
              name: bob
              email: bob@gmail.com
              password: secret
        required: true
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
      security: []
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login User
      operationId: LoginUser
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserRequest'
            example:
              email: susan@gmail.com
              password: secret
        required: true
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
      security: []
  /jobs:
    post:
      tags:
        - Jobs
      summary: Create Job
      operationId: CreateJob
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
            example:
              company: google
              position: front-end developer
        required: true
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
    get:
      tags:
        - Jobs
      summary: Get All Jobs
      operationId: GetAllJobs
      parameters: []
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
  /contact:
    post:
      tags:
        - Portfolio
      summary: Submit Contact Form
      description: Submits the portfolio "Contact Me" form and notifies the site owner by email.
      operationId: SubmitContact
      parameters: []
      requestBody:
        description: Contact form submission
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
            example:
              fullName: Jane Doe
              email: jane@example.com
              phone: '+1 555 123 4567'
              subject: Website redesign inquiry
              projectType: E-commerce
              budget: $1000 - $2000
              timeline: 4 weeks
              message: Hi, I'd like to discuss a redesign of my small business website.
        required: true
      responses:
        '201':
          description: Submission saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '400':
          description: Missing required fields
        '500':
          description: Server error while saving the submission
      deprecated: false
      security: []
  /order:
    post:
      tags:
        - Portfolio
      summary: Submit Website Order Form
      description: Submits the portfolio "Order a Website" form and notifies the site owner by email.
      operationId: SubmitOrder
      parameters: []
      requestBody:
        description: Website order submission
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            example:
              businessName: Acme Ltd
              name: John Smith
              email: john@example.com
              phone: '+1 555 987 6543'
              projectType: Portfolio website
              websitePages: Home, About, Services, Contact
              featuresNeeded: Booking form, blog
              budget: $500 - $1000
              deadline: '2026-08-01'
              referenceWebsite: https://example.com
              projectDescription: I need a clean portfolio site to showcase my work.
              preferredContactMethod: Email
              agreeToBeContacted: true
        required: true
      responses:
        '201':
          description: Submission saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Missing required fields
        '500':
          description: Server error while saving the submission
      deprecated: false
      security: []
  /jobs/{id}:
    parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: The job ID
    get:
      tags:
        - Jobs
      summary: Get Single Job
      operationId: GetSingleJob
      parameters: []
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false

    patch:
      tags:
        - Jobs
      summary: Update Job
      operationId: UpdateJob
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobRequest'
            example:
              company: random
              position: intern
        required: true
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
    delete:
      tags:
        - Jobs
      summary: Delete Job
      operationId: DeleteJob
      parameters: []
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
components:
  schemas:
    RegisterUserRequest:
      title: RegisterUserRequest
      required:
        - name
        - email
        - password
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
      example:
        name: bob
        email: bob@gmail.com
        password: secret
    LoginUserRequest:
      title: LoginUserRequest
      required:
        - email
        - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      example:
        email: susan@gmail.com
        password: secret
    CreateJobRequest:
      title: CreateJobRequest
      required:
        - company
        - position
      type: object
      properties:
        company:
          type: string
        position:
          type: string
      example:
        company: google
        position: front-end developer
    UpdateJobRequest:
      title: UpdateJobRequest
      required:
        - company
        - position
      type: object
      properties:
        company:
          type: string
        position:
          type: string
      example:
        company: random
        position: intern
    ContactRequest:
      title: ContactRequest
      required:
        - fullName
        - email
        - subject
        - message
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        subject:
          type: string
        projectType:
          type: string
        budget:
          type: string
        timeline:
          type: string
        message:
          type: string
      example:
        fullName: Jane Doe
        email: jane@example.com
        subject: Website redesign inquiry
        message: Hi, I'd like to discuss a redesign of my small business website.
    ContactResponse:
      title: ContactResponse
      type: object
      properties:
        success:
          type: boolean
        submission:
          type: object
    OrderRequest:
      title: OrderRequest
      required:
        - name
        - email
        - projectType
        - projectDescription
        - agreeToBeContacted
      type: object
      properties:
        businessName:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        projectType:
          type: string
        websitePages:
          type: string
        featuresNeeded:
          type: string
        budget:
          type: string
        deadline:
          type: string
        referenceWebsite:
          type: string
        projectDescription:
          type: string
        preferredContactMethod:
          type: string
        agreeToBeContacted:
          type: boolean
      example:
        name: John Smith
        email: john@example.com
        projectType: Portfolio website
        projectDescription: I need a clean portfolio site to showcase my work.
        agreeToBeContacted: true
    OrderResponse:
      title: OrderResponse
      type: object
      properties:
        success:
          type: boolean
        submission:
          type: object
  securitySchemes:
    httpBearer:
      type: http
      scheme: bearer
security:
  - httpBearer: []
tags:
  - name: Auth
    description: ''
  - name: Jobs
    description: ''
  - name: Portfolio
    description: Portfolio site contact and order forms
